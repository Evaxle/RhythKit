name: Build RhythKit

on:
  push:
    branches:
      - main
      - feat/rhythians-connection
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: .\build.ps1
      - shell: pwsh
        run: |
          $files = @(
            ".\dist\win-x64\RhythKit.Installer.exe",
            ".\dist\win-x64\RhythKit.Agent.exe",
            ".\dist\win-x64\RhythKit.Uninstaller.exe"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing executable: $file" }
            if ((Get-Item $file).Length -lt 1000000) { throw "Executable is unexpectedly small: $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: RhythKit-win-x64
          path: dist/win-x64/*.exe
          if-no-files-found: error
