name: Build RhythKit

on:
  push:
    branches:
      - main
      - feat/rhythians-connection
      - feature/full-rhythkit-integration
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: .\build.ps1
      - shell: pwsh
        run: |
          $file = ".\dist\win-x64\RhythKitInstall.exe"
          if (!(Test-Path $file)) { throw "Missing portable installer: $file" }
          if ((Get-Item $file).Length -lt 1000000) { throw "Installer is unexpectedly small" }
      - uses: actions/upload-artifact@v4
        with:
          name: RhythKit-win-x64
          path: dist/win-x64/RhythKitInstall.exe
          if-no-files-found: error
