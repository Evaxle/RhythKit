name: Build RhythKit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: .\build.ps1
      - shell: pwsh
        run: |
          $file = ".\dist\win-x64\RhythKitInstall.exe"
          if (!(Test-Path $file)) { throw "Missing installer" }
          if ((Get-Item $file).Length -lt 1000000) { throw "Installer is unexpectedly small" }
          git diff --exit-code -- src/RhythKit.Installer/RhythKitPayload.cs src/RhythKit.Installer/RhythKitAgentPayload.cs src/RhythKit.Installer/RhythKitUninstallerPayload.cs
      - uses: actions/upload-artifact@v4
        with:
          name: RhythKit-win-x64-windows
          path: dist/win-x64/RhythKitInstall.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: chmod +x ./build-linux.sh
      - run: ./build-linux.sh
      - run: file ./dist/win-x64/RhythKitInstall.exe
      - run: test -s ./dist/win-x64/RhythKitInstall.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RhythKit-win-x64-linux-build
          path: dist/win-x64/RhythKitInstall.exe
          if-no-files-found: error
