name: Build RhythKit

on:
  push:
    branches:
      - main
      - feat/rhythians-connection
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: .\build.ps1
      - shell: pwsh
        run: |
          if (!(Test-Path .\dist\win-x64\RhythKit.Installer.exe)) { exit 1 }
          if ((Get-Item .\dist\win-x64\RhythKit.Installer.exe).Length -lt 1000000) { exit 1 }
