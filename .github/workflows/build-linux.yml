name: Build RhythKit from Linux

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y file
      - name: Build Windows installer from Linux
        run: ./build-linux.sh
      - name: Verify Windows installer
        run: |
          test -f dist/win-x64/RhythKit.Installer.exe
          file dist/win-x64/RhythKit.Installer.exe | grep -Eq 'PE32|PE32|MS Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: RhythKit-win-x64-linux-build
          path: dist/win-x64/RhythKit.Installer.exe
          if-no-files-found: error
